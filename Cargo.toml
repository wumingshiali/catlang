[package]
name = "catlang"
version = "0.1.0"
edition = "2026"
description = "A CatLang to Zig compiler"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
codespan-reporting = "0.11"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "catc"
path = "src/main.rs"

[lib]
name = "catlang"
path = "src/lib.rs"

# Release build optimizations
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Fast release build for development
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Debug build with optimizations
[profile.dev-opt]
inherits = "dev"
opt-level = 1
